version: '3.8'

services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: simrs_db
      TZ: Asia/Jakarta
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d simrs_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"

  jaeger:
    image: docker.io/jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  prometheus:
    image: docker.io/prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml


  postgres-exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://root:secretpassword@postgres:5432/simrs_db?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres

  redis-exporter:
    image: docker.io/oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: "redis://redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      - redis

  # prometheus-podman-exporter: Alternatif cAdvisor yang kompatibel dengan Podman Rootless & Docker
  # Membaca metrik CPU/RAM per-container langsung dari Podman socket API
  podman-exporter:
    image: quay.io/navidys/prometheus-podman-exporter:latest
    user: root
    ports:
      - "9882:9882"
    environment:
      - CONTAINER_HOST=unix:///run/podman/podman.sock
    volumes:
      - /run/user/1000/podman/podman.sock:/run/podman/podman.sock:ro

  auth-service:
    build:
      context: ./src/be
      args:
        SERVICE_NAME: auth-service
    environment:
      - DATABASE_URL=postgres://root:secretpassword@postgres:5432/simrs_db?sslmode=disable
      - JAEGER_ENDPOINT=jaeger:4318
      - INITIAL_ADMIN_USERNAME=admin
      - INITIAL_ADMIN_PASSWORD=admin123
      - PORT=50051
    ports:
      - "60051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  patient-service:
    build:
      context: ./src/be
      args:
        SERVICE_NAME: patient-service
    environment:
      - DATABASE_URL=postgres://root:secretpassword@postgres:5432/simrs_db?sslmode=disable
      - JAEGER_ENDPOINT=jaeger:4318
      - REDIS_HOST=redis:6379
      - PORT=50052
    ports:
      - "60052:50052"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started

  registration-service:
    build:
      context: ./src/be
      args:
        SERVICE_NAME: registration-service
    environment:
      - DATABASE_URL=postgres://root:secretpassword@postgres:5432/simrs_db?sslmode=disable
      - JAEGER_ENDPOINT=jaeger:4318
      - REDIS_HOST=redis:6379
      - PORT=50053
    ports:
      - "60053:50053"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started

  medical-record-service:
    build:
      context: ./src/be
      args:
        SERVICE_NAME: medical-record-service
    environment:
      - DATABASE_URL=postgres://root:secretpassword@postgres:5432/simrs_db?sslmode=disable&search_path=medical_record
      - JAEGER_ENDPOINT=jaeger:4318
      - REDIS_HOST=redis:6379
      - PORT=50054
    ports:
      - "60054:50054"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started

  rawat-jalan-service:
    build:
      context: ./src/be
      args:
        SERVICE_NAME: rawat-jalan-service
    environment:
      - DATABASE_URL=postgres://root:secretpassword@postgres:5432/simrs_db?sslmode=disable&search_path=rawat_jalan
      - JAEGER_ENDPOINT=jaeger:4318
      - REDIS_HOST=redis:6379
      - PORT=50057
    ports:
      - "60057:50057"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started

  pharmacy-service:
    build:
      context: ./src/be
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: pharmacy-service
    ports:
      - "60055:50055"
    environment:
      - DATABASE_URL=postgres://root:secretpassword@postgres:5432/simrs_db?sslmode=disable
      - JAEGER_ENDPOINT=jaeger:4318
      - REDIS_HOST=redis:6379
      - PORT=50055
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started

  billing-service:
    build:
      context: ./src/be
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: billing-service
    ports:
      - "60056:50056"
    environment:
      - DATABASE_URL=postgres://root:secretpassword@postgres:5432/simrs_db?sslmode=disable
      - JAEGER_ENDPOINT=jaeger:4318
      - REDIS_HOST=redis:6379
      - PORT=50056
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started

  api-gateway:
    build:
      context: ./src/be
      args:
        SERVICE_NAME: api-gateway
    environment:
      - AUTH_SERVICE_ADDR=auth-service:50051
      - PATIENT_SERVICE_ADDR=patient-service:50052
      - REGISTRATION_SERVICE_ADDR=registration-service:50053
      - MEDICAL_RECORD_SERVICE_ADDR=medical-record-service:50054
      - EMR_SERVICE_ADDR=medical-record-service:50054
      - RAWAT_JALAN_SERVICE_ADDR=rawat-jalan-service:50057
      - PHARMACY_SERVICE_ADDR=pharmacy-service:50055
      - BILLING_SERVICE_ADDR=billing-service:50056
      - REDIS_HOST=redis:6379
      - JAEGER_ENDPOINT=jaeger:4318
      - PORT=8080
    ports:
      - "60080:8080"
    volumes:
      - ./src/be/api-gateway/docs:/app/docs
    depends_on:
      - auth-service
      - patient-service
      - registration-service
      - medical-record-service
      - rawat-jalan-service
      - pharmacy-service
      - billing-service
      - redis
      - jaeger
      - prometheus

volumes:
  postgres-data:
