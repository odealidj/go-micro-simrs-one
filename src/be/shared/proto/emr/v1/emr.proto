syntax = "proto3";

package emr.v1;

option go_package = "github.com/aliube/go-micro-simrs-one/shared/proto/emr/v1;emrv1";

service EMRService {
  rpc SubmitTriage (SubmitTriageRequest) returns (SubmitTriageResponse);
  rpc AddMedicalAction (AddMedicalActionRequest) returns (AddMedicalActionResponse);
  rpc GetMedicalRecord (GetMedicalRecordRequest) returns (GetMedicalRecordResponse);
  rpc StartEncounter (StartEncounterRequest) returns (StartEncounterResponse);
  rpc GetEstimatedWaitTime (GetEstimatedWaitTimeRequest) returns (GetEstimatedWaitTimeResponse);

  // Master KBM
  rpc SearchKBM (SearchKBMRequest) returns (SearchKBMResponse);
  rpc GetKBMDetail (GetKBMDetailRequest) returns (GetKBMDetailResponse);
  rpc GetICD10SuggestionsForKBM (GetICD10SuggestionsForKBMRequest) returns (GetICD10SuggestionsForKBMResponse);

  // Diagnosis (Dokter - Poliklinik)
  rpc AddDiagnosisKBM (AddDiagnosisKBMRequest) returns (AddDiagnosisKBMResponse);

  // Verifikasi ICD-10 (Bagian Rekam Medis)
  rpc VerifyICD10Mapping (VerifyICD10MappingRequest) returns (VerifyICD10MappingResponse);
  rpc ListPendingICD10Verifications (ListPendingICD10VerificationsRequest) returns (ListPendingICD10VerificationsResponse);
}

message GetEstimatedWaitTimeRequest {
  string doctor_id = 1;
  string department_code = 2;
  string gender = 3;
  string age_bracket = 4;
}

message GetEstimatedWaitTimeResponse {
  int64 estimated_minutes = 1;
}

// 0. Start Encounter (Perawat/Dokter)
message StartEncounterRequest {
  string encounter_no = 1;
}

message StartEncounterResponse {
  bool success = 1;
  string message = 2;
}
// 1. Triage (Perawat)
message SubmitTriageRequest {
  string encounter_no = 1;
  int32 blood_pressure_systolic = 2;
  int32 blood_pressure_diastolic = 3;
  double temperature = 4;
  int32 heart_rate = 5;
  string notes = 6;
}

message SubmitTriageResponse {
  bool success = 1;
  string message = 2;
}

// -- KBM Master --
message SearchKBMRequest {
  string query = 1;
  string body_system = 2;
  int32  limit = 3;
  int32  offset = 4;
}

message KBMItem {
  string kbm_code = 1;
  string kbm_name = 2;
  string description = 3;
  string body_system = 4;
}

message SearchKBMResponse {
  repeated KBMItem items = 1;
  int32 total = 2;
}

message GetKBMDetailRequest {
  string kbm_code = 1;
}

message GetKBMDetailResponse {
  KBMItem item = 1;
}

message GetICD10SuggestionsForKBMRequest {
  string kbm_code = 1;
}

message ICD10Suggestion {
  string icd10_code = 1;
  bool is_primary = 2;
}

message GetICD10SuggestionsForKBMResponse {
  repeated ICD10Suggestion suggestions = 1;
}

// -- Diagnosis KBM (Dokter) --
message AddDiagnosisKBMRequest {
  string encounter_no = 1;
  string kbm_code = 2;
  string notes = 3;
  string doctor_id = 4;
  string department_code = 5;
  string gender = 6;
  string age_bracket = 7;
}

message AddDiagnosisKBMResponse {
  bool success = 1;
  string message = 2;
}

// -- Verifikasi ICD-10 (Rekam Medis) --
message VerifyICD10MappingRequest {
  string encounter_no = 1;
  repeated string icd10_codes = 2;
  string notes = 3;
}

message VerifyICD10MappingResponse {
  bool success = 1;
  string message = 2;
}

message ListPendingICD10VerificationsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message PendingVerificationItem {
  string encounter_no = 1;
  string mrn = 2;
  string kbm_code = 3;
  string kbm_name = 4;
  string icd10_mapping_status = 5;
  string created_at = 6;
}

message ListPendingICD10VerificationsResponse {
  repeated PendingVerificationItem items = 1;
  int32 total = 2;
}

// 3. Medical Action (Dokter)
message AddMedicalActionRequest {
  string encounter_no = 1;
  string action_code = 2;
  string action_name = 3;
  double price = 4;
  string notes = 5;
}

message AddMedicalActionResponse {
  bool success = 1;
  string message = 2;
}

// 4. Get Record
message GetMedicalRecordRequest {
  string encounter_no = 1;
}

message MedicalAction {
  string action_code = 1;
  string action_name = 2;
  double price = 3;
}

message TriageData {
  int32 blood_pressure_systolic = 1;
  int32 blood_pressure_diastolic = 2;
  double temperature = 3;
  int32 heart_rate = 4;
  string notes = 5;
}

message GetMedicalRecordResponse {
  string encounter_no = 1;
  string patient_mrn = 2;
  TriageData triage = 3;
  repeated string icd10_codes = 4;
  string kbm_code = 5;
  string kbm_name = 6;
  string icd10_mapping_status = 7;
  repeated MedicalAction actions = 8;
  string notes = 9;
}
