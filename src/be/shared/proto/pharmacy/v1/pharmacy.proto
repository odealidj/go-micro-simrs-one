syntax = "proto3";

package pharmacy.v1;

option go_package = "github.com/aliube/go-micro-simrs-one/shared/proto/pharmacy/v1;pharmacyv1";

service PharmacyService {
  // Initiates prescription. Reserves stock (Lock).
  rpc CreatePrescription (CreatePrescriptionRequest) returns (CreatePrescriptionResponse);
  
  // Dispenses the prescription (after payment)
  rpc DispensePrescription (DispensePrescriptionRequest) returns (DispensePrescriptionResponse);

  // Saga Compensation: Release reserved stock
  rpc RollbackPrescription (RollbackPrescriptionRequest) returns (RollbackPrescriptionResponse);

  // Queue Estimation
  rpc GetEstimatedWaitTime (GetEstimatedWaitTimeRequest) returns (GetEstimatedWaitTimeResponse);

  // Master Data
  rpc GetMasterObat (GetMasterObatRequest) returns (GetMasterObatResponse);
  rpc GetMasterObatByPoli (GetMasterObatByPoliRequest) returns (GetMasterObatByPoliResponse);
  rpc GetMasterKFA (GetMasterKFARequest) returns (GetMasterKFAResponse);
  rpc GetMasterDPHO (GetMasterDPHORequest) returns (GetMasterDPHOResponse);
  rpc GetObatMappingDetails (GetObatMappingDetailsRequest) returns (GetObatMappingDetailsResponse);
}

message GetEstimatedWaitTimeRequest {
  bool is_compounded = 1;
  string diagnosis = 2;
  string doctor_id = 3;
  string department_code = 4;
  string gender = 5;
  string age_bracket = 6;
}

message GetEstimatedWaitTimeResponse {
  int64 estimated_minutes = 1;
}

message PrescriptionItem {
  string item_code = 1;
  string item_name = 2;
  int32 quantity = 3;
  string dosage = 4;
}

message CreatePrescriptionRequest {
  string encounter_no = 1;
  bool is_compounded = 2;
  repeated PrescriptionItem items = 3;
  string notes = 4;
  string diagnosis = 5;
  string gender = 6;
  string age_bracket = 7;
  string doctor_id = 8;
  string department_code = 9;
}

message CreatePrescriptionResponse {
  bool success = 1;
  string prescription_id = 2;
  double amount_to_bill = 3;
  string message = 4;
}

message DispensePrescriptionRequest {
  string prescription_id = 1;
}

message DispensePrescriptionResponse {
  bool success = 1;
  string message = 2;
}

message RollbackPrescriptionRequest {
  string prescription_id = 1;
}

message RollbackPrescriptionResponse {
  bool success = 1;
  string message = 2;
}

// Master Data
message GetMasterObatRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search_name = 3;
  string search_code = 4;
}

message MasterObat {
  string item_code = 1;
  string name = 2;
  double price = 3;
  int32 stock_quantity = 4;
  repeated string polyclinics = 5;
  int32 kfa_count = 6;
  int32 dpho_count = 7;
  bool is_fornas = 8;
  string kfa_code = 9;
  string bpjs_dpho_code = 10;
  string restriction = 11;
}

message GetMasterObatResponse {
  repeated MasterObat data = 1;
  int32 total_count = 2;
}

message GetMasterObatByPoliRequest {
  int32 page = 1;
  int32 page_size = 2;
  string poli_code = 3;
  string search_name = 4;
  string search_code = 5;
}

message GetMasterObatByPoliResponse {
  repeated MasterObat data = 1;
  int32 total_count = 2;
}

// -- KFA Catalog (Kemenkes SATUSEHAT) --
message MasterKFAItem {
  string kfa_code = 1;
  string name = 2;
  string active_substance = 3;
  string dosage_form = 4;
  string strength = 5;
  string bpom_nie = 6;
  string atc_code = 7;
  string snomed_concept_id = 8;
  bool is_active = 9;
  int32 mapped_item_count = 10;
}

message GetMasterKFARequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
}

message GetMasterKFAResponse {
  repeated MasterKFAItem data = 1;
  int32 total_count = 2;
}

// -- BPJS DPHO / FORNAS Catalog --
message MasterDPHOItem {
  string dpho_code = 1;
  string dpho_name = 2;
  bool is_fornas = 3;
  bool is_prb = 4;
  string restriction = 5;
  int32 max_qty_per_claim = 6;
  bool is_active = 7;
  int32 mapped_item_count = 8;
}

message GetMasterDPHORequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
  optional bool is_fornas = 4;
  optional bool is_prb = 5;
}

message GetMasterDPHOResponse {
  repeated MasterDPHOItem data = 1;
  int32 total_count = 2;
}

// -- Detail Map Obat --
message GetObatMappingDetailsRequest {
  string item_code = 1;
}

message ObatKFAMapDetail {
  string kfa_code = 1;
  string name = 2;
  string active_substance = 3;
  string dosage_form = 4;
  string strength = 5;
  string bpom_nie = 6;
  string atc_code = 7;
  string snomed_concept_id = 8;
  bool is_primary = 9;
  string mapping_confidence = 10;
}

message ObatDPHOMapDetail {
  string dpho_code = 1;
  string dpho_name = 2;
  bool is_fornas = 3;
  bool is_prb = 4;
  string restriction = 5;
  int32 max_qty_per_claim = 6;
}

message GetObatMappingDetailsResponse {
  string item_code = 1;
  repeated ObatKFAMapDetail kfa_mappings = 2;
  repeated ObatDPHOMapDetail dpho_mappings = 3;
  repeated string polyclinics = 4;
}

