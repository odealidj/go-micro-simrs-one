openapi: 3.0.0
info:
  title: SIMRS Microservices API
  description: API Gateway endpoints for SIMRS backend services.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local API Gateway
security:
  - BearerAuth: []
paths:
  /auth/login:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Login to get PASETO token
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /patient/register:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Register a new patient
      tags:
        - Patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                nik:
                  type: string
                dob:
                  type: string
      responses:
        '200':
          description: Patient registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /patient/{mrn}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - in: path
        name: mrn
        required: true
        schema:
          type: string
        description: Medical Record Number
    get:
      summary: Get patient by MRN
      tags:
        - Patient
      responses:
        '200':
          description: Patient found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /emr/actions:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Add medical action to EMR
      tags:
        - EMR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                encounter_no:
                  type: string
                record_id:
                  type: string
                action_code:
                  type: string
                action_name:
                  type: string
                price:
                  type: number
                notes:
                  type: string
      responses:
        '200':
          description: Action added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /pharmacy/dispense:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Dispense a prescription
      tags:
        - Pharmacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prescription_id:
                  type: string
      responses:
        '200':
          description: Prescription dispensed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /billing/invoice/{encounter_no}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - in: path
        name: encounter_no
        required: true
        schema:
          type: string
    get:
      summary: Get or Generate invoice for an encounter
      tags:
        - Billing
      responses:
        '200':
          description: Invoice retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /billing/pay:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Pay an invoice
      tags:
        - Billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invoice_id:
                  type: string
                amount:
                  type: number
      responses:
        '200':
          description: Invoice paid successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PASETO
  parameters:
    RequestIdHeader:
      in: header
      name: X-Request-ID
      schema:
        type: string
        format: uuid
        default: "123e4567-e89b-12d3-a456-426614174000"
      required: false
      description: Unique request ID for idempotency and tracing (auto-generated if not provided)
  schemas:
    SuccessResponse:
      type: object
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
