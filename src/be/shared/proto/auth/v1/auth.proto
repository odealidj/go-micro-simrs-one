syntax = "proto3";

package auth.v1;

option go_package = "github.com/aliube/go-micro-simrs-one/shared/proto/auth/v1;authv1";

service AuthService {
  // Login verifies credentials and returns a PASETO token
  rpc Login (LoginRequest) returns (LoginResponse);
  
  // Signup creates a new user account
  rpc Signup (SignupRequest) returns (SignupResponse);
  
  // ValidateToken verifies a PASETO token and returns the user's role/id
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  
  // RefreshToken exchanges a valid refresh token for a new pair of access and refresh tokens
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse);
  
  // ExtractKTPData extracts NIK, Name, and DOB from a KTP image using AI OCR
  rpc ExtractKTPData (ExtractKTPDataRequest) returns (ExtractKTPDataResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  bool success = 1;
  string access_token = 2;
  string refresh_token = 3;
  string access_token_expires_at = 4;
  string refresh_token_expires_at = 5;
  string role = 6;
  string user_id = 7;
}

message SignupRequest {
  string username = 1;
  string password = 2;
  string role = 3;
}

message SignupResponse {
  bool success = 1;
  string user_id = 2;
  string message = 3;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  bool success = 1;
  string access_token = 2;
  string refresh_token = 3;
  string access_token_expires_at = 4;
  string refresh_token_expires_at = 5;
}

message ExtractKTPDataRequest {
  string base64_image = 1;
}

message ExtractKTPDataResponse {
  bool success = 1;
  string nik = 2;
  string name = 3;
  string dob = 4;
  string error_message = 5;
}
