openapi: 3.0.0
info:
  title: SIMRS Microservices API
  description: API Gateway endpoints for SIMRS backend services.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local API Gateway
paths:
  /auth/login:
    post:
      summary: Login to get PASETO token
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /patient/register:
    post:
      summary: Register a new patient
      tags:
        - Patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                nik:
                  type: string
                dob:
                  type: string
      responses:
        '200':
          description: Patient registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /patient/{mrn}:
    get:
      summary: Get patient by MRN
      tags:
        - Patient
      parameters:
        - in: path
          name: mrn
          required: true
          schema:
            type: string
          description: Medical Record Number
      responses:
        '200':
          description: Patient found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
