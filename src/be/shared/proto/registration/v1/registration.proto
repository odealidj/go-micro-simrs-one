syntax = "proto3";

package registration.v1;

option go_package = "github.com/aliube/go-micro-simrs-one/shared/proto/registration/v1;registrationv1";

service RegistrationService {
  rpc RegisterEncounter (RegisterEncounterRequest) returns (RegisterEncounterResponse);
  rpc GetTodayEncounters (GetTodayEncountersRequest) returns (GetTodayEncountersResponse);
  rpc CancelEncounter (CancelEncounterRequest) returns (CancelEncounterResponse);
  rpc UpdateEncounterStatus (UpdateEncounterStatusRequest) returns (UpdateEncounterStatusResponse);
  
  // Metrics
  rpc GetDashboardMetrics (GetDashboardMetricsRequest) returns (GetDashboardMetricsResponse);
  
  // New RPCs
  rpc UpdateEncounterGuarantor(UpdateEncounterGuarantorRequest) returns (UpdateEncounterGuarantorResponse);
}

message UpdateEncounterGuarantorRequest {
  string encounter_no = 1;
  string guarantor = 2;
}

message UpdateEncounterGuarantorResponse {
  bool success = 1;
  string message = 2;
}

message RegisterEncounterRequest {
  string mrn = 1;
  string department_code = 2; // e.g. "IGD", "P01"
  string doctor_id = 3;
  string guarantor = 4; // e.g. "Umum", "BPJS"
}

message RegisterEncounterResponse {
  bool success = 1;
  string encounter_no = 2; // Format: YYYYMM+dept_code+seq
  string message = 3;
}

message GetTodayEncountersRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3; // optional search by MRN or Name
  string date = 4;   // optional date filter YYYY-MM-DD
}

message EncounterDetail {
  string encounter_no = 1;
  string mrn = 2;
  string department_code = 3;
  string doctor_id = 4;
  string status = 5;
  string registered_time = 6;
}

message GetTodayEncountersResponse {
  repeated EncounterDetail encounters = 1;
  int32 total_count = 2;
}

message CancelEncounterRequest {
  string encounter_no = 1;
  string reason = 2;
}

message CancelEncounterResponse {
  bool success = 1;
  string message = 2;
}

message UpdateEncounterStatusRequest {
  string encounter_no = 1;
  string status = 2;
}

message UpdateEncounterStatusResponse {
  bool success = 1;
  string message = 2;
}

message GetDashboardMetricsRequest {}

message WaitTimeMetric {
  string poli_code = 1;
  int32 average_wait_time_minutes = 2;
}

message WeeklyVisitMetric {
  string date = 1; // "YYYY-MM-DD"
  int32 total_visits = 2;
}

message GetDashboardMetricsResponse {
  int32 new_patients = 1;
  int32 old_patients = 2;
  repeated WaitTimeMetric wait_times = 3;
  repeated WeeklyVisitMetric weekly_visits = 4;
}

