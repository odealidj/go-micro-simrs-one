openapi: 3.0.0
info:
  title: SIMRS Microservices API
  description: API Gateway endpoints for SIMRS backend services.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local API Gateway
security:
  - BearerAuth: []
paths:
  /auth/login:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Login to get PASETO token
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          access_token:
                            type: string
                          refresh_token:
                            type: string
                          access_token_expires_at:
                            type: string
                          refresh_token_expires_at:
                            type: string
                          role:
                            type: string
                          user_id:
                            type: string
  /auth/refresh:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Refresh PASETO token
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Successful refresh
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          access_token:
                            type: string
                          refresh_token:
                            type: string
                          access_token_expires_at:
                            type: string
                          refresh_token_expires_at:
                            type: string
  /auth/signup/staff:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Register a new user (admin only)
      tags:
        - Auth
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                password:
                  type: string
                  minLength: 6
                role:
                  type: string
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/signup/patient:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Register a new patient (public)
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, name, nik, dob]
              properties:
                username:
                  type: string
                password:
                  type: string
                  minLength: 6
                name:
                  type: string
                nik:
                  type: string
                dob:
                  type: string
      responses:
        '200':
          description: Patient registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /patient/register:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Register a new patient
      tags:
        - Patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                nik:
                  type: string
                dob:
                  type: string
      responses:
        '200':
          description: Patient registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /patient/{mrn}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - in: path
        name: mrn
        required: true
        schema:
          type: string
        description: Medical Record Number
    get:
      summary: Get patient by MRN
      tags:
        - Patient
      responses:
        '200':
          description: Patient found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /emr/actions:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Add medical action to EMR
      tags:
        - EMR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encounter_no, action_code, action_name, price]
              properties:
                encounter_no:
                  type: string
                record_id:
                  type: string
                action_code:
                  type: string
                action_name:
                  type: string
                price:
                  type: number
                notes:
                  type: string
      responses:
        '200':
          description: Action added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      summary: Health check
      tags:
        - System
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /registrations:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Register a new patient encounter (add to queue)
      tags:
        - Registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mrn, department_code, doctor_id]
              properties:
                mrn:
                  type: string
                department_code:
                  type: string
                  example: IGD
                doctor_id:
                  type: string
      responses:
        '200':
          description: Encounter registered and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /emr/triage:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Submit triage data for an encounter
      tags:
        - EMR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encounter_no]
              properties:
                encounter_no:
                  type: string
                systolic:
                  type: integer
                diastolic:
                  type: integer
                temperature:
                  type: number
                heart_rate:
                  type: integer
                notes:
                  type: string
      responses:
        '200':
          description: Triage submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /emr/start:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Start encounter - Poli staff clicks Mulai button
      description: Changes encounter status to IN_PROGRESS and records started_at. Triggers SSE event.
      tags:
        - EMR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encounter_no]
              properties:
                encounter_no:
                  type: string
      responses:
        '200':
          description: Encounter started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: encounter_no is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /emr/diagnosis:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Add diagnosis to medical record
      description: Saves ICD-10 diagnosis. Also updates multi-dimensional wait time aggregates.
      tags:
        - EMR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encounter_no, icd10_code]
              properties:
                encounter_no:
                  type: string
                icd10_code:
                  type: string
                  example: J06
                notes:
                  type: string
                doctor_id:
                  type: string
                department_code:
                  type: string
                gender:
                  type: string
                  enum: [M, F]
                age_bracket:
                  type: string
                  example: 0-5
      responses:
        '200':
          description: Diagnosis saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: encounter_no or icd10_code is missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /emr/record/{encounter_no}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - in: path
        name: encounter_no
        required: true
        schema:
          type: string
    get:
      summary: Get medical record by encounter number
      tags:
        - EMR
      responses:
        '200':
          description: Medical record retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /pharmacy/prescriptions:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Create a new prescription
      description: Creates a prescription for an encounter. Patient must have paid before pharmacist can dispense.
      tags:
        - Pharmacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [encounter_no, items]
              properties:
                encounter_no:
                  type: string
                is_compounded:
                  type: boolean
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      item_code:
                        type: string
                      item_name:
                        type: string
                      quantity:
                        type: integer
                      dosage:
                        type: string
                notes:
                  type: string
                diagnosis:
                  type: string
                gender:
                  type: string
                age_bracket:
                  type: string
                doctor_id:
                  type: string
                department_code:
                  type: string
      responses:
        '200':
          description: Prescription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: encounter_no is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /pharmacy/dispense:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Dispense a prescription - Apoteker klik Selesai
      description: Marks prescription as DISPENSED. Requires invoice to be PAID. Records completed_at.
      tags:
        - Pharmacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prescription_id]
              properties:
                prescription_id:
                  type: string
      responses:
        '200':
          description: Prescription dispensed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /billing/invoice/{encounter_no}:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
      - in: path
        name: encounter_no
        required: true
        schema:
          type: string
    get:
      summary: Get or generate invoice for an encounter
      tags:
        - Billing
      responses:
        '200':
          description: Invoice retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
  /billing/pay:
    parameters:
      - $ref: '#/components/parameters/RequestIdHeader'
    post:
      summary: Pay an invoice - Kasir proses pembayaran
      description: Processes payment. Records paid_at. Publishes InvoicePaid event so pharmacy can dispense.
      tags:
        - Billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoice_id]
              properties:
                invoice_id:
                  type: string
                amount_paid:
                  type: number
      responses:
        '200':
          description: Invoice paid successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: invoice_id is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /queue/clinic/stream:
    get:
      summary: SSE stream for clinic queue updates
      description: |
        Server-Sent Events. Emits JSON with encounter_no, status, and estimated_wait_minutes.
      tags:
        - Queue
      security: []
      responses:
        '200':
          description: SSE stream connected
          content:
            text/event-stream:
              schema:
                type: string
  /queue/pharmacy/stream:
    get:
      summary: SSE stream for pharmacy queue updates
      description: Server-Sent Events with estimated_wait_minutes for pharmacy queue.
      tags:
        - Queue
      security: []
      responses:
        '200':
          description: SSE stream connected
          content:
            text/event-stream:
              schema:
                type: string
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: PASETO
  parameters:
    RequestIdHeader:
      in: header
      name: X-Request-ID
      schema:
        type: string
        format: uuid
        default: "123e4567-e89b-12d3-a456-426614174000"
      example: "123e4567-e89b-12d3-a456-426614174000"
      required: false
      description: Unique request ID for idempotency and tracing (auto-generated if not provided)
  schemas:
    SuccessResponse:
      type: object
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
    ErrorResponse:
      type: object
      properties:
        request_id:
          type: string
        trace_id:
          type: string
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "invalid credentials"
