global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:9091']

  - job_name: 'patient-service'
    static_configs:
      - targets: ['patient-service:9092']

  - job_name: 'registration-service'
    static_configs:
      - targets: ['registration-service:9093']

  - job_name: 'emr-service'
    static_configs:
      - targets: ['emr-service:9094']

  - job_name: 'pharmacy-service'
    static_configs:
      - targets: ['pharmacy-service:9095']

  - job_name: 'billing-service'
    static_configs:
      - targets: ['billing-service:9096']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'podman-exporter'
    static_configs:
      - targets: ['podman-exporter:9882']
